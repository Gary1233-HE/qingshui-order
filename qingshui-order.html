<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清水叫貨表轉換（獨立版）</title>
<style>
  :root{
    --bg:#f3f5f0; --card:#fff; --ink:#1c2a1e; --sub:#6b7a6d; --line:#dfe5da;
    --green:#2f7d3b; --green-d:#22602c; --hit:#e6f4e2; --warn:#b4560a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:16px;line-height:1.4;padding-bottom:96px}
  header{background:var(--green);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:19px;letter-spacing:.04em}
  header .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  header input{border:0;border-radius:8px;padding:7px 10px;font:inherit;width:150px}
  header .count{margin-left:auto;font-size:14px;opacity:.95}
  main{max-width:860px;margin:0 auto;padding:12px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:9px 14px;cursor:pointer}
  button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  button.primary:active{background:var(--green-d)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media (max-width:420px){.grid{gap:4px} main{padding:8px}}
  .item{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:6px 8px;min-width:0}
  .item.has{background:var(--hit);border-color:#9fcf96}
  .item .name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .name.flag{color:var(--warn)}
  .item input.qty{width:58px;text-align:right;font:inherit;font-weight:700;font-size:18px;
    border:1px solid var(--line);border-radius:8px;padding:6px 6px;background:#fff}
  .item .unit{width:1.3em;color:var(--sub);text-align:center;flex:none}
  .item input.ename{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px}
  .item input.eunit{width:44px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
  .item .del{padding:4px 8px;border-radius:8px;color:#a22}
  h2{font-size:15px;color:var(--sub);margin:18px 0 6px}
  textarea{width:100%;min-height:220px;font:inherit;font-size:17px;border:1px solid var(--line);
    border-radius:12px;padding:12px;background:#fff;resize:vertical}
  .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--sub);margin:6px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:6}
  .bar button{flex:1;max-width:260px;padding:13px 6px;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .note{font-size:13px;color:var(--sub);margin-top:8px}
  #print{display:none}
  @page{size:A5 portrait;margin:0}
  @media print{
    html,body{background:#fff!important;padding:0!important;margin:0!important}
    body>*{display:none!important}
    body>#print{display:block!important;box-sizing:border-box;width:148mm;height:209mm;padding:7mm;overflow:hidden;color:#000;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
    #print .ptitle{height:11mm;line-height:11mm;font-size:7mm;font-weight:800;border-bottom:.6mm solid #000;
      display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden}
    #print .pgrid{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;column-gap:24mm;margin-top:2mm}
    #print .pcell{display:flex;justify-content:space-between;align-items:center;gap:.3em;white-space:nowrap;
      overflow:hidden;font-weight:800;line-height:1;border-bottom:.25mm solid #999}
    #print .pcell b{font-weight:900}
  }
</style>
</head>
<body>
<header>
  <h1>清水叫貨表 → LINE 文字</h1>
  <div class="row">
    <input id="date" type="date" aria-label="日期">
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div class="tools">
    <button class="primary" id="btnPhoto">📷 圖片轉數量</button>
    <input type="file" id="file" accept="image/*" hidden>
    <button id="btnClear">全部清空</button>
    <button id="btnEdit">編輯品項</button>
    <button id="btnAdd" hidden>＋ 新增品項</button>
    <button id="btnReset" hidden>還原預設品項</button>
    <button id="btnSet">⚙ 辨識設定</button>
  </div>

  <div id="setPanel" hidden style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px">
    <div style="font-weight:700;margin-bottom:6px">圖片辨識設定（每台裝置設定一次）</div>
    <label class="note" for="apiKey">Gemini API 金鑰</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="貼上金鑰"
      style="width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0 8px">
    <label class="note" for="model">模型</label>
    <input id="model" type="text" autocomplete="off"
      style="width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0 8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnSaveSet">儲存</button>
      <button id="btnDelKey">刪除這台的金鑰</button>
    </div>
    <p class="note">金鑰只存在這台裝置的瀏覽器，不會寫進網頁程式碼。金鑰到 Google AI Studio（aistudio.google.com）申請。</p>
  </div>
  <div id="scan" class="note" style="margin:0 0 10px;font-size:15px"></div>
  <div class="grid" id="grid"></div>

  <h2>轉換結果</h2>
  <div class="opts">
    <label><input type="checkbox" id="optTitle" checked> 加標題與日期</label>
    <label><input type="checkbox" id="optNum"> 加編號</label>
    <label><input type="checkbox" id="optTotal" checked> 加品項數</label>
  </div>
  <textarea id="out" spellcheck="false"></textarea>
  <p class="note">版本 20261126-4。只會列出有填數量的品項；文字框內容可直接再修改。資料只存在這台裝置的瀏覽器。</p>
</main>

<div class="bar">
  <button class="primary" id="btnImg">生成圖片</button>
  <button id="btnLine">用 LINE 分享</button>
  <button id="btnPrint">列印 A5</button>
</div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<div id="imgView" hidden style="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:none;flex-direction:column;align-items:center;padding:12px;gap:10px">
  <div style="color:#fff;font-size:14px">長按圖片可儲存或分享</div>
  <img id="imgOut" alt="清水叫貨圖片" style="flex:1;min-height:0;max-width:100%;object-fit:contain">
  <div style="display:flex;gap:8px;width:100%;max-width:520px">
    <button class="primary" id="btnImgShare" style="flex:1;padding:13px 6px">分享</button>
    <button id="btnImgSave" style="flex:1;padding:13px 6px">下載</button>
    <button id="btnImgClose" style="flex:1;padding:13px 6px">關閉</button>
  </div>
</div>

<script>
// 預設品項：順序比照紙本「清水叫貨表4.0」(左欄由上到下，再右欄)
const DEFAULT = [["紅蘿蔔", "件"], ["削青", "把"], ["小青", "把"], ["迷你青", "把"], ["薑母", "件"], ["B薑", "件"], ["薑芽", "斤"], ["薑絲", "斤"], ["蒜仁", "斤"], ["水蓮", "包"], ["小玉米", "盒"], ["皇帝豆", "斤"], ["毛豆仁", "包"], ["毛豆莢", "包"], ["敏豆", "包"], ["荷蘭豆", "件"], ["甜豆", "件"], ["日本山藥", "件"], ["茭白筍", "斤"], ["玉米筍", "包"], ["玉米", "包"], ["貝貝南瓜", "件"], ["菠菜", "件"], ["茼蒿", "件"], ["地瓜葉", "件"], ["高麗菜", "件"], ["香菜", "斤"], ["芹菜管", "K"], ["美白菇", "件"], ["鴻喜菇", "件"], ["金針A", "支"], ["小杏B", "包"], ["小杏C", "包"], ["大香菇", "支"], ["小小菇", "支"], ["青龍椒", "包"], ["龍鬚菜", "件"], ["栗子仁", "包"], ["秋葵", "包"], ["娃娃菜", "件"], ["麻竹筍", "件"], ["菱角", "斤"], ["花生", "斤"], ["朝天椒", "件"], ["大辣椒", "件"], ["韭菜花", "把"], ["芥蘭芽", "件"], ["包心白", "件"], ["青花椰", "件"], ["小黃瓜", "件"], ["馬鈴薯", "件"], ["洋蔥", "件"], ["白苦瓜", "件"], ["水果椒", "件"], ["白蘿蔔", "件"], ["節瓜", "件"]
].map(a=>({n:a[0],u:a[1],q:a[2]!=null?String(a[2]):"",flag:!!a[3]}));

const BUILD="20261126-4";
// 自動更新：每次開啟時檢查線上版本，較新就自動重新載入，避免瀏覽器快取舊版
(function(){
  if(!/^https?:/.test(location.protocol)) return;
  fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
    const m=t.match(/const BUILD="([^"]+)"/);
    if(m&&m[1]!==BUILD){
      let n=0; try{n=+sessionStorage.getItem("qs-reload")||0; sessionStorage.setItem("qs-reload",n+1)}catch(e){n=9}
      if(n<2) location.replace(location.pathname+"?t="+Date.now());
    }else{ try{sessionStorage.removeItem("qs-reload")}catch(e){} }
  }).catch(()=>{});
})();
const KEY="qingshui-order-v3";
const store={
  get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
  set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
};
let items=(store.get()||{}).items || DEFAULT.map(x=>({...x}));
let editing=false;

const $=id=>document.getElementById(id);
const grid=$("grid"), out=$("out");

// 兩欄排法比照紙本：左欄先排完再排右欄
function paperOrder(list){
  const half=Math.ceil(list.length/2), r=[];
  for(let i=0;i<half;i++){ r.push(i); if(i+half<list.length) r.push(i+half); }
  return r;
}

function render(){
  grid.innerHTML="";
  paperOrder(items).forEach(i=>{
    const it=items[i], d=document.createElement("div");
    d.className="item"+(it.q!==""&&!editing?" has":"");
    if(editing){
      d.innerHTML='<input class="ename"><input class="eunit"><button class="del" title="刪除">✕</button>';
      const [en,eu,del]=d.children;
      en.value=it.n; eu.value=it.u;
      en.oninput=()=>{it.n=en.value; it.flag=false; save()};
      eu.oninput=()=>{it.u=eu.value; save()};
      del.onclick=()=>{items.splice(i,1); save(); render()};
    }else{
      d.innerHTML='<span class="name"></span><input class="qty" type="text" inputmode="decimal"><span class="unit"></span>';
      const [nm,q,u]=d.children;
      nm.textContent=it.n; if(it.flag){nm.classList.add("flag"); nm.title="照片上看不清楚，請用「編輯品項」改成正確品名";}
      u.textContent=it.u; q.value=it.q;
      q.onfocus=()=>q.select();
      q.oninput=()=>{it.q=q.value.trim(); d.classList.toggle("has",it.q!==""); save(); build()};
    }
    grid.appendChild(d);
  });
  $("btnEdit").textContent=editing?"完成編輯":"編輯品項";
  $("btnEdit").classList.toggle("on",editing);
  $("btnAdd").hidden=$("btnReset").hidden=!editing;
  build();
}

function build(){
  const picked=items.filter(x=>x.q!==""&&x.q!=="0");
  const lines=[];
  if($("optTitle").checked){
    const v=$("date").value, dt=v?(+v.slice(5,7))+"/"+(+v.slice(8,10)):"";
    lines.push("【清水叫貨】"+dt);
  }
  picked.forEach((x,k)=>lines.push(($("optNum").checked?(k+1)+". ":"")+x.n+" "+x.q+x.u));
  if($("optTotal").checked&&picked.length) lines.push("共 "+picked.length+" 項");
  out.value=lines.join("\n");
  $("count").textContent="已填 "+picked.length+" / "+items.length+" 項";
}

function save(){store.set({items})}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}

// 兩段式確認（不用瀏覽器彈窗）
function confirmBtn(btn,label,fn){
  btn.onclick=()=>{
    if(btn.dataset.arm){delete btn.dataset.arm;btn.textContent=label;fn();return}
    btn.dataset.arm=1;btn.textContent="再按一次確認";
    setTimeout(()=>{if(btn.dataset.arm){delete btn.dataset.arm;btn.textContent=label}},2500);
  };
}
confirmBtn($("btnClear"),"全部清空",()=>{items.forEach(x=>x.q="");save();render();toast("已清空")});
confirmBtn($("btnReset"),"還原預設品項",()=>{items=DEFAULT.map(x=>({...x,q:""}));save();render();toast("已還原")});
$("btnEdit").onclick=()=>{editing=!editing;render()};
$("btnAdd").onclick=()=>{items.push({n:"",u:"件",q:""});save();render();
  const e=grid.querySelectorAll(".ename");e[e.length-1].focus()};
["optTitle","optNum","optTotal","date"].forEach(id=>$(id).onchange=build);

$("btnLine").onclick=()=>{
  const a=document.createElement("a");
  a.href="https://line.me/R/share?text="+encodeURIComponent(out.value);
  a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
};

// ---- 圖片轉數量：上傳叫貨表照片，由 Gemini 辨識手寫數量 ----
const CFG="qingshui-gemini-cfg", DEFAULT_MODEL="gemini-3.8-flash";
const FALLBACK_MODELS=["gemini-3.6-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite"];
function cfgGet(){try{return JSON.parse(localStorage.getItem(CFG))||{}}catch(e){return {}}}
function cfgSet(v){try{localStorage.setItem(CFG,JSON.stringify(v));return true}catch(e){return false}}
let scanning=false;
function scanMsg(t,warn){const e=$("scan");e.textContent=t;e.style.color=warn?"var(--warn)":"var(--sub)"}
function openSet(show){
  const c=cfgGet();
  $("apiKey").value=c.key||""; $("model").value=c.model||DEFAULT_MODEL;
  $("setPanel").hidden=!show;
}
$("btnSet").onclick=()=>openSet($("setPanel").hidden);
$("btnSaveSet").onclick=()=>{
  const ok=cfgSet({key:$("apiKey").value.trim(),model:$("model").value.trim()||DEFAULT_MODEL});
  $("setPanel").hidden=true; toast(ok?"已儲存":"這個瀏覽器無法儲存設定");
};
$("btnDelKey").onclick=()=>{cfgSet({model:cfgGet().model||DEFAULT_MODEL});openSet(true);toast("已刪除金鑰")};

function toJpegBase64(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1800, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.9).split(",")[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image"))};
    img.src=url;
  });
}
$("btnPhoto").onclick=()=>{
  if(scanning) return;
  if(!cfgGet().key){openSet(true);scanMsg("請先貼上 Gemini API 金鑰並儲存，再按一次「圖片轉數量」。",true);return}
  $("file").value=""; $("file").click();
};
$("file").onchange=async()=>{
  const f=$("file").files[0]; if(!f) return;
  const c=cfgGet();
  scanning=true; $("btnPhoto").textContent="辨識中…"; scanMsg("辨識中，請稍候…");
  try{
    const b64=await toJpegBase64(f);
    const list=items.map((x,i)=>(i+1)+". "+x.n+"（"+x.u+"）").join("\n");
    const prompt="這是一張蔬果「叫貨表」的照片，表格每一格是：印刷的品名、手寫的數量、印刷的單位。\n"+
      "請找出所有有手寫數量的格子，回傳數量。沒有手寫數量的品項不要回傳。\n"+
      "品項清單（編號. 品名（單位））：\n"+list+"\n\n"+
      "規則：\n- 只讀手寫的數字，單位是印刷的，不要把單位當成數字。\n"+
      "- 清單順序和紙本格子位置完全一致：左欄由上到下是 1 到 "+Math.ceil(items.length/2)+"，右欄由上到下是 "+(Math.ceil(items.length/2)+1)+" 到 "+items.length+"。\n"+
      "- 紙本上印刷的品名可能和清單不同，或被手寫塗改（例如印刷「蒜苗」被改寫成「白K」）。遇到這種情況一律以格子位置決定編號，不要因為品名對不上就放進 other。\n"+
      "- 簡寫：「K」接在顏色後面代表蘿蔔，紅K=紅蘿蔔、白K=白蘿蔔。\n"+
      "- 只有寫在表格格子以外、完全無法對應位置的額外品項才放進 other。\n"+
      "- 數字看不清楚時仍給出最可能的值，並把該品名加進 unsure。\n"+
      "只輸出 JSON，不要其他文字，格式：\n"+
      '{"items":[{"id":編號,"q":"數量"}],"other":[{"n":"品名","q":"數量","u":"單位"}],"unsure":["品名"]}';
    const reqBody=JSON.stringify({
      contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],
      generationConfig:{responseMimeType:"application/json",temperature:0}
    });
    // 模型忙線或額度滿時，自動換備用模型重試
    const models=[c.model||DEFAULT_MODEL].concat(FALLBACK_MODELS.filter(m=>m!==(c.model||DEFAULT_MODEL)));
    let resp=null, lastErr=null;
    for(let i=0;i<models.length;i++){
      if(i>0) scanMsg("模型忙線中，改用備用模型重試（"+models[i]+"）…");
      try{
        resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+
          encodeURIComponent(models[i])+":generateContent",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-goog-api-key":c.key},
          body:reqBody
        });
      }catch(e){ lastErr=e; resp=null; break; }
      if(resp.ok) break;
      let detail=""; try{detail=((await resp.json()).error||{}).message||""}catch(e){}
      lastErr=new Error(detail); lastErr.status=resp.status;
      const retry=resp.status===429||resp.status===404||resp.status>=500;
      resp=null;
      if(!retry) break;
      await new Promise(r=>setTimeout(r,1200));
    }
    if(!resp) throw lastErr||new Error("");
    const body=await resp.json();
    const text=(((body.candidates||[])[0]||{}).content||{}).parts||[];
    const m=text.map(p=>p.text||"").join("").match(/\{[\s\S]*\}/);
    if(!m) throw new Error("parse");
    const data=JSON.parse(m[0]);
    items.forEach(x=>x.q="");
    let n=0;
    (data.items||[]).forEach(o=>{
      const it=items[Number(o.id)-1], q=String(o.q==null?"":o.q).replace(/[^0-9.]/g,"");
      if(it&&q!==""){it.q=q;n++}
    });
    const others=(data.other||[]).filter(o=>o&&o.n).map(o=>String(o.n)+" "+String(o.q||"")+String(o.u||""));
    const unsure=(data.unsure||[]).map(String);
    save(); render();
    let msg="已辨識 "+n+" 項，請對照照片核對後再送出。";
    if(unsure.length) msg+=" 不確定："+unsure.join("、")+"。";
    if(others.length) msg+=" 清單沒有的品項（請手動處理）："+others.join("、")+"。";
    scanMsg(msg,unsure.length||others.length);
  }catch(e){
    const s=e&&e.status;
    let msg="辨識失敗，請重拍清楚一點再試一次。";
    if(s===400||s===401||s===403) msg="金鑰無效或沒有權限，請到「辨識設定」檢查金鑰。";
    else if(s===404) msg="找不到模型，請到「辨識設定」檢查模型名稱。";
    else if(s===429) msg="已達免費額度或次數上限，請稍後再試。";
    else if(s>=500) msg="Gemini 所有模型目前都忙線，請過一兩分鐘再試。";
    else if(!s&&e&&e.message!=="parse"&&e.message!=="image") msg="連線失敗，請檢查網路後再試。";
    if(s&&e.message) msg+="（"+String(e.message).slice(0,120)+"）";
    scanMsg(msg,true);
  }
  scanning=false; $("btnPhoto").textContent="📷 圖片轉數量";
};

// ---- 列印 A5：有填數量的品項分兩排，字級自動放到最大 ----
function textEm(t){let w=0;for(const ch of String(t)) w+=/[\u0000-\u00ff]/.test(ch)?0.62:1;return w}
function buildPrint(){
  const picked=items.filter(x=>x.q!==""&&x.q!=="0");
  const box=$("print"); box.innerHTML="";
  if(!picked.length) return false;
  const PAGE_W=148-14, PAGE_H=210-14, TITLE=11+2, GAP=24;   // mm，A5 直式扣掉邊界
  const rows=Math.ceil(picked.length/2);
  const rowH=(PAGE_H-TITLE-2)/rows;
  const colW=(PAGE_W-GAP)/2;
  const widest=Math.max(...picked.map(x=>textEm(x.n)+textEm(x.q+x.u)+0.5));
  const font=Math.max(3,Math.min(rowH*0.8, colW/widest, 30));   // 高度、寬度兩個限制取小的
  const v=$("date").value, dt=v?(+v.slice(5,7))+"/"+(+v.slice(8,10)):"";
  const t=document.createElement("div"); t.className="ptitle";
  const t1=document.createElement("span"); t1.textContent="清水叫貨 "+dt;
  const t2=document.createElement("span"); t2.textContent="共 "+picked.length+" 項";
  t.append(t1,t2);
  const g=document.createElement("div"); g.className="pgrid";
  g.style.gridTemplateRows="repeat("+rows+","+rowH.toFixed(2)+"mm)";
  g.style.fontSize=font.toFixed(2)+"mm";
  picked.forEach(x=>{
    const c=document.createElement("div"); c.className="pcell";
    const a=document.createElement("span"); a.textContent=x.n;
    const b=document.createElement("b"); b.textContent=x.q+x.u;
    c.append(a,b); g.appendChild(c);
  });
  box.append(t,g);
  return true;
}
$("btnPrint").onclick=()=>{
  if(!buildPrint()){toast("還沒有填數量的品項");return}
  window.print();
};

// ---- 生成圖片：A5 比例、兩排、字級自動放到最大 ----
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
let imgBlob=null, imgUrl=null;
function drawImage(){
  const picked=items.filter(x=>x.q!==""&&x.q!=="0");
  if(!picked.length) return null;
  const S=12;                                   // 每 mm 幾個像素（A5 = 1776×2520）
  const W=148*S, H=210*S, PAD=7*S, GAP=24*S, TITLE=11*S;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.fillStyle="#000"; g.textBaseline="middle";
  const v=$("date").value, dt=v?(+v.slice(5,7))+"/"+(+v.slice(8,10)):"";
  g.font="800 "+(7*S)+"px "+FONT;
  g.textAlign="left";  g.fillText("清水叫貨 "+dt,PAD,PAD+TITLE/2);
  g.textAlign="right"; g.fillText("共 "+picked.length+" 項",W-PAD,PAD+TITLE/2);
  g.fillRect(PAD,PAD+TITLE,W-2*PAD,0.6*S);
  const top=PAD+TITLE+2*S, rows=Math.ceil(picked.length/2);
  const rowH=(H-PAD-top)/rows, colW=(W-2*PAD-GAP)/2;
  // 用實際量測的文字寬度決定最大字級
  const BASE=100; let widest=1;
  picked.forEach(x=>{
    g.font="800 "+BASE+"px "+FONT; const a=g.measureText(x.n).width;
    g.font="900 "+BASE+"px "+FONT; const b=g.measureText(x.q+x.u).width;
    widest=Math.max(widest,a+b+BASE*0.35);
  });
  const fs=Math.max(20,Math.min(rowH*0.8, BASE*colW/widest, 30*S));
  picked.forEach((x,i)=>{
    const col=i<rows?0:1, r=i<rows?i:i-rows;
    const x0=PAD+col*(colW+GAP), cy=top+r*rowH+rowH/2;
    g.fillStyle="#000";
    g.font="800 "+fs+"px "+FONT; g.textAlign="left";  g.fillText(x.n,x0,cy);
    g.font="900 "+fs+"px "+FONT; g.textAlign="right"; g.fillText(x.q+x.u,x0+colW,cy);
    g.fillStyle="#999"; g.fillRect(x0,top+(r+1)*rowH-0.25*S,colW,0.25*S);
  });
  return cv;
}
function imgName(){const v=$("date").value||"";return "清水叫貨_"+v.replace(/-/g,"")+".png"}
$("btnImg").onclick=()=>{
  const cv=drawImage();
  if(!cv){toast("還沒有填數量的品項");return}
  cv.toBlob(b=>{
    if(!b){toast("圖片產生失敗");return}
    imgBlob=b; if(imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl=URL.createObjectURL(b); $("imgOut").src=imgUrl;
    let canShare=false;
    try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([b],imgName(),{type:"image/png"})]}))}catch(e){}
    $("btnImgShare").hidden=!canShare;
    const v=$("imgView"); v.hidden=false; v.style.display="flex";
  },"image/png");
};
$("btnImgClose").onclick=()=>{const v=$("imgView"); v.hidden=true; v.style.display="none"};
$("btnImgSave").onclick=()=>{
  const a=document.createElement("a"); a.href=imgUrl; a.download=imgName();
  document.body.appendChild(a); a.click(); a.remove();
};
$("btnImgShare").onclick=async()=>{
  try{await navigator.share({files:[new File([imgBlob],imgName(),{type:"image/png"})]})}
  catch(e){ if(e&&e.name!=="AbortError") toast("無法分享，請長按圖片儲存") }
};

const now=new Date();
$("date").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
render();
</script>
